<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEA DE TIEMPO - ESCENARIOS CONTRATACION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }

        .title { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 15px; text-align: center; }

        .tabs-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-button {
            padding: 12px 20px;
            border: none;
            background: #e8e8e8;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: #d0d0d0;
        }

        .tab-button.active {
            background: #2c3e50;
            color: white;
        }

        .scenario-container {
            display: none;
        }

        .scenario-container.active {
            display: flex;
            flex-direction: column;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 15px 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .escala-container {
            display: flex;
            background: #ecf0f1;
            flex-shrink: 0;
            position: relative;
            overflow: visible;
        }

        .escala-labels {
            width: 500px;
            flex-shrink: 0;
        }

        .escala {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .escala-label-dias {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            padding: 5px 0;
            background: #ecf0f1;
            border-top: 1px solid #bdc3c7;
            flex-shrink: 0;
        }

        .header {
            display: flex;
            background: #2c3e50;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .header-capitulo, .header-actividad {
            width: 250px;
            padding: 15px;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .left-section {
            width: 500px;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .timeline-section {
            flex: 1;
            overflow: auto;
        }

        .row {
            display: flex;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
            height: 50px;
        }

        .row:hover {
            background: #f9f9f9;
        }

        .row.tics-highlighted {
            background: #e8f8f5;
        }

        .capitulo-name {
            width: 250px;
            padding: 15px;
            font-weight: bold;
            background: #ecf0f1;
            border-right: 1px solid #ddd;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            font-size: 11px;
        }

        .actividad-name {
            width: 250px;
            padding: 15px;
            border-right: 1px solid #ddd;
            font-size: 11px;
            flex-shrink: 0;
        }

        .timeline {
            position: relative;
            height: 50px;
            display: flex;
            align-items: center;
            background-color: white;
        }

        .barra {
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: 10px;
        }

        .barra.milestone {
            width: 12px !important;
            height: 12px !important;
            top: 19px !important;
            border-radius: 50% !important;
            font-size: 0 !important;
            padding: 0 !important;
        }

        .barra.na {
            width: 20px !important;
            height: 20px !important;
            top: 15px !important;
            border-radius: 0 !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-size: 16px !important;
            font-weight: bold !important;
            color: #c0392b !important;
            background: transparent !important;
        }

        .barra.entrada-bim {
            border: 2.5px dashed #0047AB;
        }

        .barra.entrada-srm {
            border: 2.5px dashed #000000;
        }

        .barra.entrada-ia {
            border: 2.5px dashed #00AA00;
        }

        .tooltip {
            position: absolute;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1000;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            max-width: 200px;
        }

        .tooltip.top {
            bottom: 40px;
        }

        .tooltip.bottom {
            top: 40px;
        }

        svg.grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="title">LÍNEA DE TIEMPO - ESCENARIOS DE CONTRATACION</div>

    <div class="tabs-container">
        <button class="tab-button active" onclick="switchTab('pesimista')" id="btn-pesimista">Contratación Específica</button>
        <button class="tab-button" onclick="switchTab('optimista')" id="btn-optimista">Proceso Actual</button>
        <button class="tab-button" onclick="switchTab('automatizacion')" id="btn-automatizacion">SRM + Automatización</button>
        <button class="tab-button" onclick="switchTab('comparar')" id="btn-comparar">Comparar</button>
    </div>

    <!-- ESCENARIO AUTOMATIZACIÓN -->
    <div id="automatizacion" class="scenario-container">
        <div class="container">
            <div class="legend" id="legend-auto"></div>
            <div class="escala-container">
                <div class="escala-labels"></div>
                <div class="escala-wrapper">
                    <div class="escala" id="escala-header-auto"></div>
                    <div class="escala-label-dias">(Días)</div>
                </div>
            </div>
            <div class="header">
                <div class="header-capitulo">Capítulo</div>
                <div class="header-actividad">Actividad</div>
            </div>
            <div class="content-wrapper">
                <div class="left-section" id="left-section-auto"></div>
                <div class="timeline-section" id="timeline-section-auto"></div>
            </div>
        </div>
    </div>

    <!-- ESCENARIO OPTIMISTA -->
    <div id="optimista" class="scenario-container">
        <div class="container">
            <div class="legend" id="legend-opt"></div>
            <div class="escala-container">
                <div class="escala-labels"></div>
                <div class="escala" id="escala-header-opt"></div>
            </div>
            <div class="header">
                <div class="header-capitulo">Capítulo</div>
                <div class="header-actividad">Actividad</div>
            </div>
            <div class="content-wrapper">
                <div class="left-section" id="left-section-opt"></div>
                <div class="timeline-section" id="timeline-section-opt"></div>
            </div>
        </div>
    </div>

    <!-- ESCENARIO PESIMISTA -->
    <div id="pesimista" class="scenario-container active">
        <div class="container">
            <div class="legend" id="legend-pes"></div>
            <div class="escala-container">
                <div class="escala-labels"></div>
                <div class="escala" id="escala-header-pes"></div>
            </div>
            <div class="header">
                <div class="header-capitulo">Capítulo</div>
                <div class="header-actividad">Actividad</div>
            </div>
            <div class="content-wrapper">
                <div class="left-section" id="left-section-pes"></div>
                <div class="timeline-section" id="timeline-section-pes"></div>
            </div>
        </div>
    </div>

    <!-- PESTAÑA DE COMPARACIÓN -->
    <div id="comparar" class="scenario-container">
        <div style="padding: 20px; background: white; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <div style="display: flex; gap: 20px; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label style="font-weight: bold;">Escenario 1:</label>
                    <select id="escenario1" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;" onchange="actualizarComparacion()">
                        <option value="pesimista">Contratación Específica</option>
                        <option value="optimista">Proceso Actual</option>
                        <option value="automatizacion">SRM + Automatización</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label style="font-weight: bold;">Escenario 2:</label>
                    <select id="escenario2" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;" onchange="actualizarComparacion()">
                        <option value="pesimista">Contratación Específica</option>
                        <option value="optimista">Proceso Actual</option>
                        <option value="automatizacion" selected>SRM + Automatización</option>
                    </select>
                </div>
            </div>
        </div>
        <div style="height: 85vh; display: flex; gap: 15px; padding: 15px; border-radius: 8px;">
            <div style="flex: 1; display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;">
                <div style="padding: 15px; background: #2c3e50; color: white; font-weight: bold; text-align: center;" id="titulo-comparacion1">Pesimista</div>
                <div style="flex: 1; overflow-y: auto; overflow-x: hidden;" id="contenedor-comparacion1" class="comparacion-scroll"></div>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;">
                <div style="padding: 15px; background: #2c3e50; color: white; font-weight: bold; text-align: center;" id="titulo-comparacion2">Control</div>
                <div style="flex: 1; overflow-y: auto; overflow-x: hidden;" id="contenedor-comparacion2" class="comparacion-scroll"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Ocultar todos los escenarios
            document.querySelectorAll('.scenario-container').forEach(el => {
                el.classList.remove('active');
            });

            // Mostrar el escenario seleccionado
            document.getElementById(tabName).classList.add('active');

            // Actualizar botones activos
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        const tiemposEscenarios = {
            'pesimista': 203,
            'optimista': 91,
            'automatizacion': null // Se calcula dinámicamente
        };

        const areas = {
            'DIRECTOR': { color: '#3498db', label: 'Director de Obra y Residentes' },
            'CONTROL_COSTOS': { color: '#e74c3c', label: 'Control de Costos' },
            'ADMINISTRATIVO': { color: '#2ecc71', label: 'Administrativo' },
            'COMITE': { color: '#f39c12', label: 'Comité' },
            'CONTRATISTA': { color: '#9b59b6', label: 'Contratista' },
            'TECNICO': { color: '#1abc9c', label: 'Técnico/Presupuesto' },
            'CONTROL_INTERNO': { color: '#34495e', label: 'Control Interno' }
        };

        const actividadAreas = [
            'DIRECTOR', 'DIRECTOR', 'DIRECTOR', 'DIRECTOR', 'DIRECTOR',
            'CONTROL_COSTOS', 'CONTROL_COSTOS', 'CONTROL_COSTOS', 'COMITE', 'DIRECTOR',
            'ADMINISTRATIVO', 'DIRECTOR', 'CONTROL_COSTOS', 'ADMINISTRATIVO', 'DIRECTOR',
            'ADMINISTRATIVO', 'ADMINISTRATIVO', 'CONTRATISTA', 'ADMINISTRATIVO', 'CONTROL_INTERNO',
            'DIRECTOR', 'ADMINISTRATIVO', 'DIRECTOR', 'ADMINISTRATIVO', 'ADMINISTRATIVO'
        ];

        // Función para actualizar los botones con el tiempo total
        function actualizarBotonesPestanas() {
            document.getElementById('btn-pesimista').textContent = 'Contratación Específica (' + tiemposEscenarios['pesimista'] + ' días)';
            document.getElementById('btn-optimista').textContent = 'Proceso Actual (' + tiemposEscenarios['optimista'] + ' días)';
            if (tiemposEscenarios['automatizacion']) {
                document.getElementById('btn-automatizacion').textContent = 'SRM + Automatización (' + tiemposEscenarios['automatizacion'] + ' días)';
            }
        }

        // ============ ESCENARIO AUTOMATIZACIÓN ============
        function renderAutomatizacion() {
            const actividadesData = [
                {capitulo: 'CALCULO DE CANTIDADES', nombre: 'CALCULO DE CANTIDADES', dias: 4, inicio: 1, entrada: 'BIM'},
                {capitulo: '', nombre: 'PLIEGO DE LICITACIÓN REDES', dias: 0, inicio: 1, entrada: ''},
                {capitulo: '', nombre: 'LICITACIONES', dias: 1, inicio: 5, entrada: 'SRM'},
                {capitulo: '', nombre: 'RECIBO DE COTIZACIÓN', dias: 7, inicio: 6, entrada: 'SRM'},
                {capitulo: 'CUADRO COMPARATIVO', nombre: 'REALIZAR CUADRO COMPARATIVO EN FORMATO DE CONTROL', dias: 1, inicio: 13, entrada: 'SRM'},
                {capitulo: '', nombre: 'REVISIÓN POR ÁREA DE CONTROL DE COSTOS', dias: 4, inicio: 2, entrada: ''},
                {capitulo: '', nombre: 'CONCILIACIÓN', dias: 4, inicio: 2, entrada: ''},
                {capitulo: '', nombre: 'CONCILIACIÓN CON PPTO, TECNICO, DISEÑO', dias: 'DISCONTINUA', inicio: 2, entrada: ''},
                {capitulo: '', nombre: 'PRESENTACIÓN CUADRO COMPARATIVO COMITÉ', dias: 7, inicio: 14, entrada: ''},
                {capitulo: '', nombre: 'FIRMA ZOHO', dias: 0, inicio: 21, entrada: 'SRM'},
                {capitulo: '', nombre: 'CREACIÓN DE TERCERO', dias: 4, inicio: 2, entrada: 'SRM'},
                {capitulo: 'SOLICITUD DE CONTRATACION', nombre: 'REALIZAR SOLICITUD DE CONTRATO', dias: 0, inicio: 21, entrada: 'SRM'},
                {capitulo: '', nombre: 'PROYECCIÓN', dias: 4, inicio: 2, entrada: ''},
                {capitulo: 'ELABORACION DE CONTRATO', nombre: 'MIGRACIÓN DE SOLICITUD DE CONTRATO A SINCO', dias: 1, inicio: 21, entrada: ''},
                {capitulo: '', nombre: 'APROBACIÓN EN SINCO', dias: 1, inicio: 22, entrada: ''},
                {capitulo: '', nombre: 'IMPRESIÓN DIGITAL, DEPENDE DE LA CANTIDAD DE CONTRATOS ( MINUTAS)', dias: 1, inicio: 23, entrada: 'IA'},
                {capitulo: '', nombre: 'FIRMA ZOHO', dias: 2, inicio: 24, entrada: 'IA'},
                {capitulo: '', nombre: 'TRÁMITE, RECEPCIÓN Y REVISIÓN PÓLIZAS', dias: 7, inicio: 26, entrada: 'IA'},
                {capitulo: 'PERFECCIONAMIENTO DE CONTRATO', nombre: 'ENVÍO A CONTROL INTERNO', dias: 7, inicio: 26, entrada: ''},
                {capitulo: '', nombre: 'LISTA DE CHEQUEO CONTROL INTERNO', dias: 1, inicio: 33, entrada: ''},
                {capitulo: 'CORTES DE OBRA', nombre: 'PREACTAS DIGITALES', dias: 7, inicio: 34, entrada: ''},
                {capitulo: '', nombre: 'ACTA DE OBRA Y FACTURACIÓN', dias: 7, inicio: 34, entrada: ''},
                {capitulo: '', nombre: 'PROGRAMACIÓN Y APROBACIÓN', dias: 7, inicio: 34, entrada: ''},
                {capitulo: '', nombre: 'PROGRAMACIÓN DE PAGOS', dias: 7, inicio: 34, entrada: ''},
                {capitulo: 'PAGOS', nombre: 'VERIFICACIÓN DE PAGOS', dias: 0, inicio: 41, entrada: ''}
            ];

            const maxDay = Math.max(...actividadesData
                .filter(a => a.dias !== 'TR' && a.inicio !== 'TR' && typeof a.dias === 'number')
                .map(a => a.inicio + a.dias - 1)
            );
            tiemposEscenarios['automatizacion'] = maxDay + 1;
            const timelineWidth = (maxDay + 2) * 10;

            const data = actividadesData.map((act, idx) => {
                if (act.dias === 'NA') {
                    return { left: (act.inicio - 1) * 10, width: 0, label: '', area: idx, type: 'NA' };
                } else if (act.dias === 'DISCONTINUA') {
                    return { left: (act.inicio - 1) * 10, width: timelineWidth - ((act.inicio - 1) * 10), label: '', area: idx, type: 'DISCONTINUA', maxDay: maxDay };
                } else if (act.dias === 'TR' && act.inicio === 'TR') {
                    return { left: 0, width: timelineWidth, label: '', area: idx, type: 'TR' };
                } else {
                    const duration = typeof act.dias === 'number' ? act.dias : 0;
                    return {
                        left: (act.inicio - 1) * 10,
                        width: duration * 10 || 5,
                        label: duration > 0 ? duration : '',
                        area: idx,
                        type: 'normal',
                        milestone: duration === 0
                    };
                }
            });

            const legend = document.getElementById('legend-auto');
            legend.innerHTML = '';
            Object.entries(areas).forEach(([key, {color, label}]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-color" style="background: ${color}"></div><span>${label}</span>`;
                legend.appendChild(item);
            });

            const separator = document.createElement('div');
            separator.style.width = '1px';
            separator.style.background = '#ddd';
            separator.style.margin = '0 10px';
            legend.appendChild(separator);

            const entradas = [
                {label: 'BIM', color: '#0047AB'},
                {label: 'SRM', color: '#000000'},
                {label: 'IA-TECNOLOGIA', color: '#00AA00'}
            ];

            entradas.forEach(({label, color}) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div style="width: 20px; height: 20px; border: 2.5px dashed ${color}; border-radius: 3px;"></div><span>${label}</span>`;
                legend.appendChild(item);
            });

            const escalaHeader = document.getElementById('escala-header-auto');
            escalaHeader.innerHTML = '';

            let escalaScroll = document.createElement('div');
            escalaScroll.style.flex = '1';
            escalaScroll.style.overflow = 'auto';
            escalaScroll.style.display = 'flex';
            escalaScroll.style.minHeight = '50px';
            escalaScroll.id = 'escala-scroll-auto';

            const scaleContent = document.createElement('div');
            scaleContent.style.minWidth = timelineWidth + 'px';
            scaleContent.style.position = 'relative';
            scaleContent.style.height = '40px';
            scaleContent.style.paddingTop = '5px';

            for (let day = 0; day <= maxDay + 5; day += 1) {
                const position = day * 10;
                const line = document.createElement('div');
                line.style.position = 'absolute';
                line.style.left = position + 'px';
                line.style.top = (day % 10 === 0 ? '0' : '5');
                line.style.width = '1px';
                line.style.height = (day % 10 === 0 ? '15px' : '10px');
                line.style.background = (day % 10 === 0 ? '#333' : '#999');
                scaleContent.appendChild(line);

                if (day % 5 === 0) {
                    const label = document.createElement('div');
                    label.textContent = day;
                    label.style.position = 'absolute';
                    label.style.left = (position - 10) + 'px';
                    label.style.top = '18px';
                    label.style.fontSize = '10px';
                    label.style.fontWeight = 'bold';
                    label.style.width = '20px';
                    label.style.textAlign = 'center';
                    scaleContent.appendChild(label);
                }
            }

            escalaScroll.appendChild(scaleContent);
            escalaHeader.appendChild(escalaScroll);

            const leftSection = document.getElementById('left-section-auto');
            leftSection.innerHTML = '';
            actividadesData.forEach((act) => {
                const row = document.createElement('div');
                row.className = 'row';
                const capitulo = document.createElement('div');
                capitulo.className = 'capitulo-name';
                capitulo.textContent = act.capitulo;
                const actividad = document.createElement('div');
                actividad.className = 'actividad-name';
                actividad.textContent = act.nombre;
                row.appendChild(capitulo);
                row.appendChild(actividad);
                leftSection.appendChild(row);
            });

            const timelineSection = document.getElementById('timeline-section-auto');
            timelineSection.innerHTML = '';
            data.forEach((bar, idx) => {
                const row = document.createElement('div');
                row.className = 'row';
                const timeline = document.createElement('div');
                timeline.className = 'timeline';
                timeline.style.minWidth = timelineWidth + 'px';
                timeline.style.position = 'relative';

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'grid-lines');
                svg.style.position = 'absolute';
                svg.style.top = '0';
                svg.style.left = '0';
                svg.style.width = '100%';
                svg.style.height = '100%';
                svg.setAttribute('viewBox', '0 0 ' + timelineWidth + ' 50');
                svg.setAttribute('preserveAspectRatio', 'none');

                for (let day = 0; day <= maxDay + 5; day += 1) {
                    const position = (day / (maxDay + 5)) * 100;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', position + '%');
                    line.setAttribute('y1', '0');
                    line.setAttribute('x2', position + '%');
                    line.setAttribute('y2', '100%');
                    line.setAttribute('stroke', day % 10 === 0 ? '#333' : '#e0e0e0');
                    line.setAttribute('stroke-width', day % 10 === 0 ? '1' : '0.5');
                    svg.appendChild(line);
                }
                timeline.appendChild(svg);

                if (bar.type === 'DISCONTINUA') {
                    const areaKey = actividadAreas[idx];
                    const color = areas[areaKey].color;

                    // Crear puntos desde inicio hasta maxDay
                    for (let day = actividadesData[idx].inicio; day <= bar.maxDay; day += 2) {
                        const punto = document.createElement('div');
                        punto.className = 'barra milestone';
                        punto.style.background = color;
                        punto.style.left = ((day - 1) * 10 - 6) + 'px';
                        punto.style.zIndex = '1';
                        timeline.appendChild(punto);
                    }

                    // Crear barra continua desde maxDay en adelante
                    const barraFinal = document.createElement('div');
                    barraFinal.className = 'barra';
                    barraFinal.style.background = color;
                    barraFinal.style.left = (bar.maxDay * 10) + 'px';
                    barraFinal.style.width = (timelineWidth - (bar.maxDay * 10)) + 'px';
                    barraFinal.style.zIndex = '1';

                    const tooltip = document.createElement('div');
                    tooltip.className = 'tooltip';
                    tooltip.textContent = `Continuo desde Día ${bar.maxDay}`;
                    barraFinal.appendChild(tooltip);

                    barraFinal.addEventListener('mouseenter', () => {
                        tooltip.style.display = 'block';
                        tooltip.classList.add('top');
                    });
                    barraFinal.addEventListener('mouseleave', () => {
                        tooltip.style.display = 'none';
                    });

                    timeline.appendChild(barraFinal);
                } else {
                    const barra = document.createElement('div');
                    const areaKey = actividadAreas[idx];
                    barra.style.background = areas[areaKey].color;
                    barra.style.zIndex = '1';
                    barra.style.left = bar.left + 'px';
                    barra.style.width = bar.width + 'px';

                    if (bar.type === 'NA') {
                        barra.className = 'barra na';
                        barra.textContent = '✗';
                    } else if (bar.type === 'TR') {
                        barra.className = 'barra';
                        barra.style.opacity = '0.3';
                        if (actividadesData[idx].entrada) {
                            barra.classList.add('entrada-' + actividadesData[idx].entrada.toLowerCase());
                        }
                    } else if (bar.milestone) {
                        barra.className = 'barra milestone';
                        barra.textContent = '';
                    } else {
                        barra.className = 'barra';
                        barra.textContent = bar.label || '';
                        if (actividadesData[idx].entrada) {
                            barra.classList.add('entrada-' + actividadesData[idx].entrada.toLowerCase());
                        }
                    }

                    const tooltip = document.createElement('div');
                    tooltip.className = 'tooltip';

                    if (bar.type === 'NA') {
                        tooltip.textContent = 'No Aplica';
                    } else if (bar.type === 'TR') {
                        const entrada = actividadesData[idx].entrada ? ` | ${actividadesData[idx].entrada}` : '';
                        tooltip.textContent = `Transversal (Inicio a Fin)${entrada}`;
                    } else {
                        const inicio = actividadesData[idx].inicio;
                        const fin = inicio + (actividadesData[idx].dias || 0) - 1;
                        const entrada = actividadesData[idx].entrada ? ` | ${actividadesData[idx].entrada}` : '';
                        tooltip.textContent = `Día ${inicio} - Día ${fin}${entrada}`;
                    }

                    barra.appendChild(tooltip);

                    barra.addEventListener('mouseenter', () => {
                        tooltip.style.display = 'block';
                        if (idx === 0) {
                            tooltip.classList.remove('top');
                            tooltip.classList.add('bottom');
                        } else {
                            tooltip.classList.remove('bottom');
                            tooltip.classList.add('top');
                        }
                        const tooltipRect = tooltip.getBoundingClientRect();
                        if (tooltipRect.left < 0) {
                            tooltip.style.left = '0';
                            tooltip.style.transform = 'none';
                        } else if (tooltipRect.right > window.innerWidth) {
                            tooltip.style.right = '0';
                            tooltip.style.left = 'auto';
                            tooltip.style.transform = 'none';
                        } else {
                            tooltip.style.left = '50%';
                            tooltip.style.right = 'auto';
                            tooltip.style.transform = 'translateX(-50%)';
                        }
                    });

                    barra.addEventListener('mouseleave', () => {
                        tooltip.style.display = 'none';
                        tooltip.style.left = '50%';
                        tooltip.style.right = 'auto';
                        tooltip.style.transform = 'translateX(-50%)';
                    });

                    timeline.appendChild(barra);
                }
                row.appendChild(timeline);
                timelineSection.appendChild(row);
            });

        }
